<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Mounuu ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #ffdde1, #ee9ca7);
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 40px 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .heart {
            font-size: 60px;
            animation: heartbeat 1.2s infinite;
        }

        h1 {
            color: #e91e63;
            font-size: 32px;
            margin: 15px 0;
        }

        p {
            color: #555;
            font-size: 18px;
            line-height: 1.6;
        }

        .question {
            font-size: 23px;
            font-weight: bold;
            color: #333;
            margin: 25px 0;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 25px;
            position: relative;
        }

        button {
            border: none;
            padding: 14px 30px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
        }

        #yesBtn {
            background: #e91e63;
            color: white;
            box-shadow: 0 5px 15px rgba(233, 30, 99, 0.4);
        }

        #yesBtn:hover {
            transform: scale(1.1);
            background: #d81b60;
        }

        #noBtn {
            background: #777;
            color: white;
            position: relative;
        }

        .message {
            display: none;
            margin-top: 25px;
            color: #e91e63;
            font-size: 22px;
            font-weight: bold;
            animation: pop 0.5s ease;
        }

        .floating-heart {
            position: fixed;
            bottom: -30px;
            font-size: 25px;
            animation: floatUp 5s linear forwards;
            pointer-events: none;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        @keyframes pop {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heart">❤️</div>

        <h1>Hey Mounuu! 💕</h1>

        <p>
            From all the little moments to all the beautiful memories,
            I want to ask you something special... 🥰
        </p>

        <div class="question">
            Will you be my forever partner? 💍❤️
        </div>

        <div class="buttons">
            <button id="yesBtn" onclick="sayYes()">YES ❤️</button>
            <button id="noBtn">NO 😜</button>
        </div>

        <div class="message" id="message">
            Yayyyyy! 🥹❤️<br><br>
            I knew you'd say YES! 💕<br>
            Forever starts now, Mounuu! 💍✨
        </div>

    </div>

    <script>

        const noBtn = document.getElementById("noBtn");

        // Make the NO button escape when the mouse gets close
        noBtn.addEventListener("mouseover", moveButton);

        // Also works on mobile/touch
        noBtn.addEventListener("touchstart", function(event) {
            event.preventDefault();
            moveButton();
        });

        function moveButton() {

            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            noBtn.style.position = "fixed";
            noBtn.style.left = randomX + "px";
            noBtn.style.top = randomY + "px";
        }

        function sayYes() {

            document.querySelector(".question").innerHTML =
                "You chose YES! 🥹❤️";

            document.getElementById("message").style.display = "block";

            document.getElementById("yesBtn").style.display = "none";
            document.getElementById("noBtn").style.display = "none";

            // Create lots of hearts
            for (let i = 0; i < 30; i++) {
                setTimeout(createHeart, i * 100);
            }
        }

        function createHeart() {

            const heart = document.createElement("div");

            heart.className = "floating-heart";
            heart.innerHTML = ["❤️", "💕", "💖", "💗", "💘"][Math.floor(Math.random() * 5)];

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (3 + Math.random() * 3) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

    </script>

</body>
</html>
